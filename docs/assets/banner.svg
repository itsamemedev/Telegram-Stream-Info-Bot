<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="NIGHTCRAWLER — Restream Control Room">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="55%" stop-color="#111823"/>
      <stop offset="100%" stop-color="#0d1420"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffb347"/>
      <stop offset="50%" stop-color="#ff8c42"/>
      <stop offset="100%" stop-color="#e8623a"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd9a0"/>
      <stop offset="45%" stop-color="#ff8c42"/>
      <stop offset="100%" stop-color="#7a2d12"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8c42" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ff8c42" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2de1c2" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#2de1c2" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- Scan-Linien: das Terminal-Motiv der PWA-Icons -->
  <g fill="#7fe7d4" fill-opacity="0.030">
    <rect x="0" y="0"   width="1200" height="2"/><rect x="0" y="8"   width="1200" height="2"/>
    <rect x="0" y="16"  width="1200" height="2"/><rect x="0" y="24"  width="1200" height="2"/>
    <rect x="0" y="32"  width="1200" height="2"/><rect x="0" y="40"  width="1200" height="2"/>
    <rect x="0" y="48"  width="1200" height="2"/><rect x="0" y="56"  width="1200" height="2"/>
    <rect x="0" y="64"  width="1200" height="2"/><rect x="0" y="72"  width="1200" height="2"/>
    <rect x="0" y="80"  width="1200" height="2"/><rect x="0" y="88"  width="1200" height="2"/>
    <rect x="0" y="96"  width="1200" height="2"/><rect x="0" y="104" width="1200" height="2"/>
    <rect x="0" y="112" width="1200" height="2"/><rect x="0" y="120" width="1200" height="2"/>
    <rect x="0" y="128" width="1200" height="2"/><rect x="0" y="136" width="1200" height="2"/>
    <rect x="0" y="144" width="1200" height="2"/><rect x="0" y="152" width="1200" height="2"/>
    <rect x="0" y="160" width="1200" height="2"/><rect x="0" y="168" width="1200" height="2"/>
    <rect x="0" y="176" width="1200" height="2"/><rect x="0" y="184" width="1200" height="2"/>
    <rect x="0" y="192" width="1200" height="2"/><rect x="0" y="200" width="1200" height="2"/>
    <rect x="0" y="208" width="1200" height="2"/><rect x="0" y="216" width="1200" height="2"/>
    <rect x="0" y="224" width="1200" height="2"/><rect x="0" y="232" width="1200" height="2"/>
    <rect x="0" y="240" width="1200" height="2"/><rect x="0" y="248" width="1200" height="2"/>
    <rect x="0" y="256" width="1200" height="2"/><rect x="0" y="264" width="1200" height="2"/>
    <rect x="0" y="272" width="1200" height="2"/><rect x="0" y="280" width="1200" height="2"/>
    <rect x="0" y="288" width="1200" height="2"/><rect x="0" y="296" width="1200" height="2"/>
  </g>

  <!-- Phosphor-Orb -->
  <circle cx="150" cy="150" r="118" fill="url(#glow)"/>
  <circle cx="150" cy="150" r="58" fill="url(#orb)"/>
  <circle cx="150" cy="150" r="58" fill="none" stroke="#ffd9a0" stroke-opacity="0.55" stroke-width="1.5"/>
  <circle cx="150" cy="150" r="80" fill="none" stroke="#ff8c42" stroke-opacity="0.30" stroke-width="1"/>
  <circle cx="150" cy="150" r="96" fill="none" stroke="#2de1c2" stroke-opacity="0.16" stroke-width="1"/>
  <circle cx="132" cy="130" r="16" fill="#fff3e0" fill-opacity="0.20"/>

  <!-- HUD-Eckwinkel -->
  <g stroke="#2de1c2" stroke-opacity="0.5" stroke-width="2" fill="none">
    <path d="M40 40 h34 M40 40 v34"/>
    <path d="M1160 40 h-34 M1160 40 v34"/>
    <path d="M40 260 h34 M40 260 v-34"/>
    <path d="M1160 260 h-34 M1160 260 v-34"/>
  </g>

  <!-- Wortmarke -->
  <text x="300" y="130" font-family="'DejaVu Sans Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
        font-size="66" font-weight="bold" letter-spacing="7" fill="url(#amber)">NIGHTCRAWLER</text>
  <text x="304" y="168" font-family="'DejaVu Sans Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
        font-size="20" letter-spacing="4.2" fill="#7fe7d4" fill-opacity="0.92">v4.0  ·  RESTREAM CONTROL ROOM</text>

  <line x1="304" y1="192" x2="1120" y2="192" stroke="url(#fade)" stroke-width="1.5"/>

  <text x="304" y="226" font-family="'DejaVu Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif"
        font-size="17" fill="#c8d4e0" fill-opacity="0.88">Erkennen · Aufnehmen · Restreamen · Moderieren · Auswerten</text>

  <!-- Plattform-Chips -->
  <g font-family="'DejaVu Sans Mono',ui-monospace,monospace" font-size="13" letter-spacing="1.6">
    <rect x="304" y="244" width="86" height="26" rx="13" fill="#000000" fill-opacity="0.45" stroke="#ffffff" stroke-opacity="0.22"/>
    <text x="347" y="261" fill="#e6edf3" text-anchor="middle">TIKTOK</text>
    <rect x="398" y="244" width="70" height="26" rx="13" fill="#53fc18" fill-opacity="0.14" stroke="#53fc18" stroke-opacity="0.5"/>
    <text x="433" y="261" fill="#8dfc5e" text-anchor="middle">KICK</text>
    <rect x="476" y="244" width="86" height="26" rx="13" fill="#9146ff" fill-opacity="0.16" stroke="#9146ff" stroke-opacity="0.55"/>
    <text x="519" y="261" fill="#c4a2ff" text-anchor="middle">TWITCH</text>
    <rect x="570" y="244" width="94" height="26" rx="13" fill="#ff0000" fill-opacity="0.13" stroke="#ff4d4d" stroke-opacity="0.5"/>
    <text x="617" y="261" fill="#ff9d9d" text-anchor="middle">YOUTUBE</text>
    <rect x="672" y="244" width="94" height="26" rx="13" fill="#26a5e4" fill-opacity="0.15" stroke="#26a5e4" stroke-opacity="0.5"/>
    <text x="719" y="261" fill="#8fd3f4" text-anchor="middle">TELEGRAM</text>
    <rect x="774" y="244" width="90" height="26" rx="13" fill="#5865f2" fill-opacity="0.17" stroke="#5865f2" stroke-opacity="0.55"/>
    <text x="819" y="261" fill="#aeb6f8" text-anchor="middle">DISCORD</text>
  </g>

  <!-- Kennzahlen-HUD rechts: was die Grössenordnung des Projekts ist -->
  <g font-family="'DejaVu Sans Mono',ui-monospace,monospace">
    <rect x="906" y="66" width="230" height="168" rx="10" fill="#0a0e14" fill-opacity="0.55"
          stroke="#2de1c2" stroke-opacity="0.24" stroke-width="1"/>
    <text x="922" y="90" font-size="11" letter-spacing="2.4" fill="#2de1c2" fill-opacity="0.75">SYSTEM</text>
    <line x1="922" y1="98" x2="1120" y2="98" stroke="#2de1c2" stroke-opacity="0.18" stroke-width="1"/>

    <text x="922"  y="124" font-size="26" font-weight="bold" fill="#ffb347">345</text>
    <text x="988"  y="124" font-size="12" fill="#c8d4e0" fill-opacity="0.72">API-Routen</text>

    <text x="922"  y="156" font-size="26" font-weight="bold" fill="#ffb347">45</text>
    <text x="988"  y="156" font-size="12" fill="#c8d4e0" fill-opacity="0.72">Slash-Commands</text>

    <text x="922"  y="188" font-size="26" font-weight="bold" fill="#ffb347">12</text>
    <text x="988"  y="188" font-size="12" fill="#c8d4e0" fill-opacity="0.72">Sentinel-Agenten</text>

    <circle cx="928" cy="212" r="4" fill="#53fc18"/>
    <text x="942" y="217" font-size="12" letter-spacing="1.4" fill="#8dfc5e">PRODUKTIV · 24/7</text>
  </g>
</svg>
