# v4.2-W134: bis hier stand die unveraenderte Vorlage mit leerem
# package-ecosystem — Dependabot lief damit nie, und keine Sicherheitsmeldung
# zu einer der 18 Abhaengigkeiten kam je als Pull-Request an. Der Audit vom
# 31.10. fand 69 bekannte Schwachstellen in den erlaubten Untergrenzen
# (docs/SECURITY_AUDIT.md).
#
# Dependabot oeffnet nur Pull-Requests. Zusammengefuehrt wird nach der
# Pruefkette aus CLAUDE.md, wie bei jeder anderen Aenderung.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # TikTokLive haengt an einer undokumentierten TikTok-API und hat mit 7.0
      # die Lizenz gewechselt (docs/DEPENDENCY_AUDIT.md). Ein Sprung der
      # Hauptversion kommt nur ueber einen gepruefen Prototypen, nicht ueber
      # einen automatischen Pull-Request.
      - dependency-name: "TikTokLive"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
