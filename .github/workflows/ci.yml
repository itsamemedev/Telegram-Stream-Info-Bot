# Die Pflicht-Prüfkette als CI — dieselben Schritte wie in docs/CONTRIBUTING.md.
#
# Seit v4.1-W31 läuft auch test_smoke.py hier — der Job `smoke` führt bot.py
# wirklich aus. Die alte Begründung ("braucht den vollen Serverbestand") war
# falsch: TikTokLive und python-telegram-bot stubbt der Test selbst, alles
# andere wird erst in Funktionen importiert. Übrig bleiben fünf Pakete in
# requirements-smoke.txt. ffmpeg, streamlink und yt-dlp fasst er nicht an,
# ein .env braucht er nicht — er setzt sich die nötigen Variablen selbst.
#
# Python 3.12 ist Mindestversion: bot.py nutzt f-strings mit Backslash
# (PEP 701) — unter 3.11 stirbt schon ast.parse().

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (py_compile · pyflakes · ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Prüfwerkzeuge installieren
        run: python -m pip install --upgrade pip pyflakes ruff

      # Der vendored QR-Encoder (nc/_vendor/segno) ist Fremdcode mit eigener
      # Lizenz — er wird nicht gepflegt und deshalb auch nicht geprüft.
      - name: Dateiliste bauen
        run: |
          find . -name '*.py' -not -path './nc/_vendor/*' -not -path './.git/*' \
            > /tmp/pyfiles.txt
          wc -l < /tmp/pyfiles.txt

      - name: py_compile
        run: xargs -a /tmp/pyfiles.txt python -m py_compile

      - name: pyflakes (0 Befunde erwartet)
        run: xargs -a /tmp/pyfiles.txt python -m pyflakes

      - name: ruff
        run: python -m ruff check --select F,E9,B --ignore B905 --exclude nc/_vendor .

      # .env.example wird aus dem Quellcode erzeugt und veraltet sonst still:
      # ein neues os.getenv() steht dann nirgends in der Vorlage. Ausserdem war
      # genau hier ein Fehler versteckt — "NAME=   # (Geheimnis)" sieht wie ein
      # Kommentar aus, ist aber der WERT. Der Check faengt beides ab.
      - name: .env.example ist aktuell (aus dem Quellcode erzeugt)
        run: python tools/gen_env_example.py --check

      # Die Skripte unter tools/ sind Teil der Auslieferung — installer.sh und
      # motd.sh laufen auf fremden Maschinen, deploy.sh auf der Produktion.
      # Kein Grund, sie schlechter zu pruefen als den Python-Anteil.
      - name: shellcheck über die Skripte
        run: |
          command -v shellcheck >/dev/null || sudo apt-get install -y -qq shellcheck
          # v4.1-W17: tools/lib/ MIT pruefen. Der alte Glob endete bei
          # tools/*.sh — das erste Skript unter tools/lib/ (i18n.sh) waere
          # nie geprueft worden, obwohl es von installer.sh und motd.sh
          # gesourct wird und damit in beiden mitlaeuft. Ein Fehler dort
          # traefe die Installation, ohne dass CI etwas sagt.
          shellcheck -S warning tools/*.sh
          shellcheck -S warning -s sh tools/lib/*.sh

      # v4.1-W20: Die Uebersetzung wurde bis hierher NUR von den Vertraegen
      # gedeckt. Das reicht funktional, meldet aber "ein Vertrag ist rot"
      # statt "dieser Text fehlt im Katalog" — und genau die Zahl ist die
      # Arbeitsanweisung. Drei Zeilen, die den Befund direkt zeigen.
      #
      # Reihenfolge mit Absicht: erst pruefen, ob ueberhaupt an der Quelle
      # umschlossen wurde (i18n_wrap), dann ob der Katalog vollstaendig ist.
      # Andersherum meldete der Katalog "vollstaendig", waehrend die Haelfte
      # der Fehlertexte gar nicht erst eingesammelt wurde.
      - name: Uebersetzung — Quelle umschlossen, Katalog vollstaendig
        run: |
          python tools/i18n_wrap.py --check
          python tools/i18n_extract.py --check en
          python tools/i18n_tools.py --check en

  templates:
    name: Templates (doppelte IDs · CSS-Bilanz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Prüfwerkzeuge installieren
        run: python -m pip install --upgrade pip pyflakes ruff

      - name: ncpatch check
        run: python tools/ncpatch.py check

  doku:
    name: Doku (Zahlen · interne Anker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # README.md und CLAUDE.md nennen Kennzahlen, die im Quelltext stehen:
      # Routen, Zeilen, Module, Agenten, .env-Variablen. Zweimal sind sie
      # still auseinandergelaufen — 345 statt 355 Routen, 12 statt 13
      # Sentinel-Agenten. Hier faellt das vor dem Merge auf statt Monate
      # spaeter. Prueft ausserdem die internen Anker: ein Badge zeigte ins
      # Leere, weil im Emoji der Ueberschrift ein Variation Selector steckt.
      - name: ncpatch docs
        run: python tools/ncpatch.py docs

      # v4.2-W83. Die "eine Regel" des Projekts steht auf .claude/INDEX.md:
      # nie im Monolithen suchen, sondern erst fragen wo etwas steht. Genau
      # diese Datei wurde von nichts geprueft. Am 13.09. war sie 483 Zeilen
      # veraltet — /healthz stand auf 17805 und lag auf 17839. Ein Index, der
      # um 34 Zeilen danebenliegt, ist schlimmer als keiner: er schickt jeden
      # `ncpatch show` an die falsche Stelle, und der Leser merkt es erst,
      # wenn der Ausschnitt nicht passt.
      - name: Navigationskarte ist aktuell
        run: python tools/ncpatch.py map --check

  stille:
    name: Stille except-Blöcke (kein Zuwachs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # v4.2-W65. CLAUDE.md nennt stille except-Blöcke seit Langem "den
      # Hauptfeind" — gemessen wurde es nie. Beim Nachzählen: 1746 Blöcke,
      # davon 1086 ohne jede Meldung. Jede Welle dieser Reihe kam aus dieser
      # Klasse: W51 (blinder Recorder), W55 (taubes Ohr), W60 (Panel weg),
      # W63 (unsichtbare Aufnahme), W64 (Rechnung im Chat).
      #
      # Der Bestand wird hier NICHT eingefordert — 1086 auf einmal wären ein
      # Quartal und ein unprüfbarer Diff. Eingefordert wird, dass er nicht
      # WÄCHST. Das ist der Unterschied zwischen einer Schuld, die man
      # abträgt, und einer, die sich verzinst.
      - name: Kein Zuwachs an stillen except-Blöcken
        run: python tools/stillecheck.py --sperre

      # v4.2-W66. CLAUDE.md nennt die Fenster der Form src[i:i + 3000]
      # namentlich als Bruchstelle, und in W62 hat eines zugeschlagen:
      # src[j:j + 4200] reichte nicht mehr über den gewachsenen Frame-Feeder
      # und meldete "kein fester Takt", während stop.wait(takt) zwei Zeilen
      # dahinter stand. Ein Vertrag, der bei gesundem Code fällt, lehrt,
      # Vertragsbrüche nicht ernst zu nehmen.
      #
      # Die 34 verbliebenen haben gemessen Luft (--spielraum). Verhindert
      # wird, dass NEUE dazukommen.
      - name: Keine neuen Fenster fester Länge in Verträgen
        run: python tools/vertragscheck.py --sperre

      # v4.2-W68. Zwei Fragen, die vorher niemand gestellt hat: trägt jeder
      # Eintrag in requirements.txt eine Untergrenze (bis W68 keiner von 17),
      # und ist überhaupt jedes importierte Fremdpaket dort erklärt?
      #
      # Der Vertrag aus v4.1-W31 prüft nur die MODUL-EBENE und nur gegen
      # requirements-smoke.txt. Genau die teuren Pakete werden aber erst IN
      # Funktionen importiert — boto3, faster_whisper, redis, pymysql, httpx,
      # requests, socks, websockets_proxy. Ein `import stripe` in einer
      # Funktion fiele heute niemandem auf: auf dem Server läuft es, eine
      # frische Installation stirbt Monate später an einer Stelle, die
      # niemand mit dem Import in Verbindung bringt.
      - name: Abhängigkeiten erklärt und mit Untergrenze
        run: python tools/abhaengigkeiten.py --sperre

      # v4.2-W70. Gemessen wird der GANZE Produktionscode, nicht nur bot.py —
      # und das ist der ganze Witz. Die größte Funktion des Bestands steht in
      # discordbot.py (_discord_run_once, 1730 Zeilen), und diese Datei wurde
      # in v4.2-W15 AUS bot.py herausgelöst, genau gegen dieses Problem. Die
      # Masse ist umgezogen, nicht geschrumpft. Ein Maß, das nur bot.py
      # anschaut, hätte die Verlagerung als Erfolg verbucht.
      #
      # Gezählt wird die ANZAHL über Stufen, nicht die Länge: eine Sperre, die
      # jede zusätzliche Zeile in einer großen Funktion meldet, fällt bei jeder
      # normalen Fehlerbehebung und ist in einer Woche abgeschaltet.
      - name: Keine neue Riesenfunktion
        run: python tools/monolith.py --sperre

      # v4.2-W81. stillecheck misst stille `except`-Blöcke. Das ist die eine
      # Hälfte. Die andere hat der Betreiber am 13.09. gemeldet: whisper
      # liefert kein Transkript, und für live erkannte TikTok-Nutzer kommt
      # keine gültige Stream-URL. Beide Wege scheitern OHNE Absturz — sie
      # kehren ordentlich zurück, nur mit leerem Ergebnis. stillecheck fällt
      # dort nicht: es gibt keinen stillen `except`, sondern ein stilles
      # `return`.
      #
      # _resolve_via_webcast_api_v2 hatte elf solche Ausgänge, acht auf
      # log.debug und drei ganz ohne Zeile. Ein log.debug erscheint in einem
      # INFO- oder ERROR-Log nie — für den Betreiber ist das dasselbe wie
      # `pass`. Wie bei W65/W66 wird der Bestand (478) nicht eingefordert,
      # nur sein Wachstum verhindert.
      - name: Kein Zuwachs an stummen Fehlerpfaden
        run: python tools/blindstellen.py --sperre

  tests:
    name: Verträge & Module (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Bewusst minimal: orjson fuer die statischen Verträge, Flask seit W106 —
      # die Aufnahmen-Routen sind ein Blueprint, und der Vertrag prueft die
      # registrierten Regeln an einer echten Flask-App statt an Quelltext.
      # Alles andere in nc/ und brain/ ist stdlib-only.
      #
      # v4.2-W84: waitress kommt dazu. Der Vertrag prueft, dass das Dashboard
      # ohne TLS wirklich auf waitress laeuft statt auf dem
      # Werkzeug-Entwicklungsserver — und diese Frage kann nur beantworten,
      # wer das Paket hat. Ohne es hier meldete nc/webserver.waehle() sauber
      # "nicht installiert", der Vertrag wuerde gruen und die eigentliche
      # Aussage nie geprueft.
      - name: Minimale Abhängigkeiten
        run: python -m pip install --upgrade pip orjson flask waitress

      - name: Statische Restream-Verträge
        run: python test_restream.py

      - name: nc/ — Fachmodule
        run: python test_nc_modules.py

      - name: brain/ ↔ Bot — Brücke
        run: python test_m2_bridge.py

      # M6 (LLM-Runtime) und test_bughunt sind hier bewusst außen vor: M6
      # erwartet ein NICHT erreichbares Backend und schlägt fehl, sobald der
      # Runner ins Netz darf; test_bughunt braucht Flask.
      - name: brain/ — Module M1, M3, M4, M5, M7
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python brain/test_m1.py
          python brain/test_m3.py
          python brain/test_m4.py
          python brain/test_m5.py
          python brain/test_m7.py

      - name: nc/intel — Archiv, Transkripte, Reels
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python nc/intel/test_intel.py

  einzeln:
    name: Verträge einzeln (pytest) · Überdeckung
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Minimale Abhängigkeiten
        run: python -m pip install --upgrade pip orjson flask waitress pytest coverage

      # v4.2-W86. Die Suiten waren nur ueber ihren eigenen Runner fahrbar:
      # `python test_nc_modules.py`, alles oder nichts, rund eine Minute je
      # Lauf. Der Grund war kein Vorsatz, sondern der Aufbau der
      # Testdatenbank mitten in main() — wer einen EINZELNEN Vertrag rief,
      # bekam keine konfigurierte Datenbank, `db_conn()` fiel auf den
      # Vorgabepfad zurueck und legte ein tiktok_bot.db IM
      # ARBEITSVERZEICHNIS an. Beim zweiten Lauf starb _test_dbexport dann an
      # "table dbx_t already exists".
      #
      # Dieser Job haelt fest, dass die Vertraege einzeln lauffaehig BLEIBEN.
      # Er ersetzt den Job darueber nicht — der faehrt weiter die Suiten als
      # Ganzes und ist die Sperre.
      - name: Jeder Vertrag einzeln (kein gemeinsamer Zustand)
        run: python -m pytest

      - name: Keine Streudatei im Arbeitsverzeichnis
        run: |
          # Genau der Befund, der W86 ausgeloest hat. git status statt eines
          # Namensvergleichs: es soll AUCH auffallen, wenn kuenftig etwas
          # anderes liegen bleibt.
          if [ -n "$(git status --porcelain)" ]; then
            echo "Der Testlauf hat den Arbeitsbaum veraendert:"
            git status --porcelain
            exit 1
          fi
          echo "Arbeitsbaum unveraendert."

      # v4.2-W86. Dieses Projekt misst viel und sperrt viel — stille except,
      # stumme return, Riesenfunktionen, .env-Reihenfolge, feste Fenster,
      # Paketgrenzen. Eine Zahl fehlte, und es ist die, die den 322
      # Vertraegen erst ihren Massstab gibt: welcher Teil von nc/ und brain/
      # wird beim Pruflauf ueberhaupt ausgefuehrt? Die Antwort ist 47,4 %.
      #
      # Gesperrt wird die ANZAHL ungeprufter Anweisungen, nicht der Prozent-
      # satz: ein Prozentsatz springt auch dann, wenn nichts schlechter wurde.
      - name: Keine neue ungeprüfte Fläche
        run: python tools/ueberdeckung.py --sperre

  smoke:
    name: Rauchtest (bot.py laeuft wirklich)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # requirements-smoke.txt statt requirements.txt: der Rauchtest braucht
      # weder faster-whisper noch boto3 noch uvloop, und genau deren
      # Installationsdauer war die Begruendung, warum dieser Job jahrelang
      # fehlte. Fuenf Pakete, rund 20 Sekunden.
      - name: Laufzeitstack (nur was die Modul-Ebene braucht)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-smoke.txt

      # Das hier prueft, was KEINE der statischen Suiten pruefen kann: ob
      # bot.py ueberhaupt importierbar ist, ob die Modul-Ebene ohne NameError
      # durchlaeuft, ob alle Routen registriert werden und ob sie beim Aufruf
      # nicht in einen 500er laufen. Genau solche Fehler haben in W26 und W29
      # in Produktion zugeschlagen — statisch waren sie unsichtbar.
      - name: test_smoke.py
        env:
          PYTHONUTF8: "1"
        run: python test_smoke.py

      # v4.2-W67. CLAUDE.md warnt seit Langem: "Modul-Konstanten frieren .env
      # ein" — geprüft hat es nichts, und der Bestand hat den Satz an der
      # teuersten Stelle gebrochen. nc/freeai.py baute seine Basen-Liste beim
      # Import, also VOR load_dotenv(), und damit haben POLLINATIONS_API_KEY
      # und LLM7_TOKEN nie einen Request erreicht.
      #
      # Dieser Schritt steht hier und nicht bei den statischen Prüfungen,
      # weil er den Bot WIRKLICH STARTEN muss: ein AST-Lauf sieht nur das
      # wörtliche os.getenv auf Modul-Ebene und fand einen von fünf Fällen.
      # Die anderen vier standen in einer Funktion, die auf Modul-Ebene
      # aufgerufen wird — die Aufrufkette sieht man nur beim Ausführen.
      - name: Keine .env-Lesung vor load_dotenv()
        env:
          PYTHONUTF8: "1"
        run: python tools/importzeit.py --sperre

  secrets:
    name: Kein Geheimnis im Diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ein einmal committetes Geheimnis steht auch nach dem Löschen noch in
      # der Historie. Dieser Job ist die letzte billige Chance, das zu merken.
      - name: .env darf nicht versioniert sein
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env ist versioniert — sofort entfernen und alle Schluessel neu ausstellen."
            exit 1
          fi
          echo "OK — keine .env im Index."

      - name: Offensichtliche Schlüsselmuster
        run: |
          set +e
          PAT='(sk-[A-Za-z0-9]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,}|xox[baprs]-|[0-9]{9,10}:AA[A-Za-z0-9_-]{30,}|BEGIN (RSA|OPENSSH) PRIVATE KEY)'
          HITS=$(git grep -InE "$PAT" -- . ':!nc/_vendor' ':!.github/workflows/ci.yml')
          if [ -n "$HITS" ]; then
            echo "::error::Moegliches Geheimnis im Repository:"
            echo "$HITS"
            exit 1
          fi
          echo "OK — kein Treffer."
