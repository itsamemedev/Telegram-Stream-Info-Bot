# CodeQL — Advanced Setup (v4.2-W3).
#
# WARUM NICHT MEHR DAS DEFAULT-SETUP: py/stack-trace-exposure meldete 208
# Stellen, von denen 193 durch nc/fehlertext.nach_aussen laufen und dort
# nachweislich gesaeubert werden. Die Datenflussanalyse sieht die Saeuberung
# nicht — sie verfolgt str(e) durch die Funktion hindurch bis in die Antwort.
#
# 208 Meldungen, die niemand mehr einzeln liest, sind schlimmer als keine: in
# ihnen geht die eine echte unter. Genau das ist passiert — der Befund in
# nc/routes/brain.py (str(ex), anderer Variablenname als in der W30-Pruefung)
# stand wochenlang unbemerkt in der Liste.
#
# Das Default-Setup kann keine eigene Abfrage laden. Deshalb dieser Workflow.
# Er faehrt DIESELBEN Sprachen und DIESELBE Standard-Suite; der einzige
# Unterschied steht in .github/codeql/codeql-config.yml.
#
# ACHTUNG: Solange in den Repo-Einstellungen das Default-Setup aktiv ist,
# bricht dieser Workflow beim Hochladen ab ("default setup is enabled").
# Einmalig abschalten unter:
#   Settings -> Code security -> Code scanning -> CodeQL analysis
#   -> Default setup -> Disable
name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Woechentlich, damit neue Abfragen aus dem Bundle auch ohne Commit greifen.
    - cron: "31 4 * * 1"
  # Von Hand anstossbar. Gebraucht beim ersten Mal: der Lauf direkt nach dem
  # Umstellen scheitert noch am Default-Setup, und ohne workflow_dispatch
  # bleibt nur ein Leer-Commit, um ihn zu wiederholen.
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@v7

      - name: CodeQL initialisieren
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Analyse
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          output: codeql-sarif

      # v5.11.4: die Befunde auch im Job-Log, nicht nur im Security-Tab. Die
      # PR-Pruefung nennt einen neuen Befund nur dann mit Datei und Zeile, wenn
      # er in einer geaenderten Zeile liegt; bei einem grossen Diff steht dort
      # nur „1 high" — und wer den Security-Tab nicht oeffnen kann, sucht blind
      # (PR #232: drei Runden Raten fuer einen einzigen Befund). Eine Zeile je
      # Befund: Schwere, Regel, Ort, Meldung — kein Quelltext.
      - name: Befunde ins Log
        if: always()
        run: |
          python3 - <<'PYEOF'
          import glob, json
          zeilen = []
          for pfad in glob.glob("codeql-sarif/*.sarif"):
              with open(pfad, encoding="utf-8") as f:
                  daten = json.load(f)
              for lauf in daten.get("runs", []):
                  werkzeug = lauf.get("tool", {})
                  regeln = {}
                  for teil in [werkzeug.get("driver", {})] + werkzeug.get("extensions", []):
                      for r in teil.get("rules", []):
                          regeln[r.get("id")] = r.get("properties", {}).get("security-severity", "")
                  for erg in lauf.get("results", []):
                      ort = erg["locations"][0]["physicalLocation"]
                      zeilen.append("%-4s %-45s %s:%s  %s" % (
                          regeln.get(erg.get("ruleId"), ""), erg.get("ruleId"),
                          ort["artifactLocation"]["uri"], ort.get("region", {}).get("startLine"),
                          erg["message"]["text"].replace("\n", " ")[:160]))
          for z in sorted(zeilen, reverse=True):
              print(z)
          print("%d Befunde" % len(zeilen))
          PYEOF
