# pytest.ini — v4.2-W86: der zweite Weg durch dieselben Vertraege.
#
# Die Suiten bleiben, wie sie sind: `python test_nc_modules.py` ist der Weg,
# den die CI faehrt und der in der Pflicht-Pruefkette steht. Diese Datei
# macht daneben den EINZELNEN Vertrag fahrbar — fuer die Arbeit an einem
# Befund und fuer die Ueberdeckungsmessung.
#
#     python -m pytest                              alle Vertraege einzeln
#     python -m pytest -k w83                       nur die aus Welle 83
#     python -m pytest "test_nc_modules.py::_test_dbexport"    genau einer
#
# python_functions ist der ganze Trick: die Vertraege heissen `_test_*`, weil
# sie aus `main()` gerufen werden und nicht oeffentlich sind. pytest sammelt
# per Vorgabe nur `test_*` und faende damit KEINEN einzigen von ihnen — es
# meldete "no tests ran" und saehe aus wie ein gruener Lauf.
[pytest]
python_files = test_nc_modules.py test_restream.py
python_functions = _test_* test_*
# Ohne das sammelt pytest die Suiten zusaetzlich aus dem Arbeitsverzeichnis
# des jeweiligen Laufs ein — .claude/worktrees traegt Arbeitskopien paralleler
# Agenten, und die gehoeren nie in einen Lauf.
norecursedirs = .git .claude nc/_vendor recordings build node_modules
addopts = -q -p no:randomly
