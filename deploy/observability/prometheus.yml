# NIGHTCRAWLER — Prometheus (v4.2-W127)
#
# Vorlage. tools/observability.sh setzt die @@…@@-Stellen ein und legt das
# Ergebnis nach /etc/nightcrawler/observability/prometheus.yml. Von Hand
# geaenderte Werte ueberschreibt der naechste Lauf — Einstellungen gehoeren in
# die Schalter von observability.sh, nicht hierher.
#
# Abgefragt wird 127.0.0.1 und NICHT die oeffentliche Adresse: das Deck laesst
# Anfragen von Loopback ohne Anmeldung durch (bot.py, _auth_guard). Damit
# braucht Prometheus keinen DASHBOARD_TOKEN, und kein Geheimnis wandert in
# eine zweite Datei.

global:
  # 30 s: der Bot erhebt seinen Schnappschuss alle 10 s (nc/kennzahlen.py),
  # und die Datenbank-Zaehler hoechstens einmal je Minute (W122b). Schneller
  # abzufragen ergaebe nur dieselben Werte oefter.
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - @@REGELN@@/*.yml

scrape_configs:
  - job_name: nightcrawler
    metrics_path: /metrics
    scheme: @@SCHEMA@@
    # Nur fuer https wirksam (DASHBOARD_TLS_CERT): das Zertifikat lautet auf
    # die Domain, abgefragt wird 127.0.0.1 — ohne diesen Schalter scheiterte
    # jede Abfrage am Namen. Auf Loopback gibt es keinen Weg dazwischen.
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ["127.0.0.1:@@DASH_PORT@@"]

  # Prometheus selbst: ohne diese Zeile faellt nicht auf, dass die Regeln
  # nicht mehr ausgewertet werden.
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:@@PROM_PORT@@"]
