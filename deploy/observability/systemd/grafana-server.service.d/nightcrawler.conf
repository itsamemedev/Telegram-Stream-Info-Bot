# NIGHTCRAWLER — Grafana nur lokal (v4.2-W127), geschrieben von tools/observability.sh.
# Grafana lauscht ab Werk auf *:3000 mit admin/admin. Dieselbe Regel wie fuer
# das Deck (W84): erreichbar per SSH-Tunnel, nicht per offenem Port.
#   ssh -L 3001:127.0.0.1:3000 server   ->  http://localhost:3001
# (3001 lokal: den Port 3000 belegt im Bericht des Installers schon der Tunnel zum Deck.)
[Service]
Environment=GF_SERVER_HTTP_ADDR=127.0.0.1
Environment=GF_ANALYTICS_REPORTING_ENABLED=false
Environment=GF_ANALYTICS_CHECK_FOR_UPDATES=false
